[project]
name = "rusa-rides-mcp"
version = "0.1.0"
description = "MCP server that logs into rusa.org with your own credentials and exposes your ride history as tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.scripts]
rusa-rides-mcp = "rusa_rides_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rusa_rides_mcp"]
